<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方向 02 · 形即信息 — 五层抽出</title>
<link rel="preload" href="fonts/instrument-serif-400.woff2" as="font" type="font/woff2">
<style>
@font-face{font-family:"Noto Sans SC";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/noto-sans-sc.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/instrument-serif-400.woff2") format("woff2")}

:root{
  --paper:#0D0C0A; --ink:#F0EAE0; --ink-2:#BDB4A6; --ink-3:#9A9083;
  --rule:rgba(240,234,224,.22); --hair:rgba(240,234,224,.10); --signal:#C97B45;
  --sans:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.75 var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#leads{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* 角标：制图感 */
.corner{position:fixed;width:14px;height:14px;border:0 solid var(--rule);pointer-events:none}
.corner.tl{top:22px;left:22px;border-top-width:1px;border-left-width:1px}
.corner.tr{top:22px;right:22px;border-top-width:1px;border-right-width:1px}
.corner.bl{bottom:22px;left:22px;border-bottom-width:1px;border-left-width:1px}
.corner.br{bottom:22px;right:22px;border-bottom-width:1px;border-right-width:1px}

.panel{position:fixed;left:56px;top:50%;transform:translateY(-50%);width:392px;z-index:5}
.eyebrow{font-size:12px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin:0 0 18px}
.panel h1{font-size:15px;font-weight:500;margin:0 0 4px;letter-spacing:.01em}
.panel .sub{font-size:13px;color:var(--ink-3);margin:0 0 34px;line-height:1.7}
.stack{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;gap:0 14px;
  padding:15px 4px 15px 0;border-bottom:1px solid var(--hair);cursor:pointer;
  transition:color .22s var(--ease),opacity .22s var(--ease);
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;
  font:inherit;color:inherit;--ease:cubic-bezier(.2,.7,.1,1)}
.row .num{font-family:var(--serif);font-size:13px;color:var(--ink-3);transition:color .22s var(--ease)}
.row .nm{font-size:16px;font-weight:500;letter-spacing:.01em}
.row .mt{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;transition:color .22s var(--ease)}
.row .ds{grid-column:2/4;font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.6;
  max-height:0;opacity:0;overflow:hidden;transition:max-height .34s var(--ease),opacity .24s var(--ease)}
.row.on .num,.row.on .mt{color:var(--signal)}
.row.on .ds{max-height:44px;opacity:1}
.stack.dim .row:not(.on){opacity:.42}
.row:focus-visible{outline:1px solid var(--signal);outline-offset:4px}
.note{margin:30px 0 0;font-size:12px;color:var(--ink-3);line-height:1.7}
.note b{font-weight:400;color:var(--ink-2)}

.meta{margin-top:36px;padding-top:20px;border-top:1px solid var(--hair)}
.meta .k{font-size:12px;color:var(--ink-3);letter-spacing:.08em}
.meta .v{font-family:var(--serif);font-size:40px;line-height:1.1;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums}
.meta .u{font-size:13px;color:var(--ink-3);margin-top:2px}
.meta .cap{margin-top:18px;font-size:12px;color:var(--ink-3);line-height:1.8}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<svg id="leads"></svg>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div class="panel">
  <p class="eyebrow">方向 02 · 形即信息</p>
  <h1>五层剖面</h1>
  <p class="sub">左侧列表与右侧物体是同一件事。<br>指向任一层，该层抽出。</p>
  <ul class="stack" id="stack"></ul>
  <p class="note"><b>规则：</b>无常驻自转，只有指针视差；<br>抽出只由列表指认触发，其余层压暗但不透明。</p>
  <div class="meta">
    <div class="k">当前层</div>
    <div class="v" id="mv">—</div>
    <div class="u" id="mu">指向任一层</div>
    <div class="cap">抽出距离 +0.70 · 两盏光<br>不是透明退隐，是压暗退居后景</div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
"use strict";
var THREE=window.THREE;
var $=function(s){return document.querySelector(s);};
var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var LAYERS=[
  {nm:"UI 层",  mt:"SSE · Citation", ds:"流式出口与引用回传，结果回到界面而不是留在日志里", kind:"notch",  r:1.00},
  {nm:"服务层", mt:"52 endpoints",   ds:"接口面可以枚举出来，也能一条条跑通",               kind:"port",   r:1.08},
  {nm:"业务层", mt:"3,454 lines",    ds:"编排写在代码里，不是画在流程图上",                 kind:"etch",   r:1.16},
  {nm:"数据层", mt:"12 tables",      ds:"表结构与迁移脚本都在仓库，可重建",                 kind:"groove", r:1.24},
  {nm:"容器层", mt:"5 containers",   ds:"本地一条命令起来，环境可复现",                     kind:"slot",   r:1.32}
];
var BASE_Y=[0.70,0.42,0.14,-0.14,-0.42];

/* ---------- 列表 ---------- */
var stack=$("#stack");
LAYERS.forEach(function(L,i){
  var li=document.createElement("li");
  li.innerHTML='<button class="row" type="button" data-i="'+i+'">'+
    '<span class="num">0'+(i+1)+'</span>'+
    '<span class="nm">'+L.nm+'</span>'+
    '<span class="mt">'+L.mt+'</span>'+
    '<span class="ds">'+L.ds+'</span></button>';
  stack.appendChild(li);
});
var rows=[].slice.call(stack.querySelectorAll(".row"));
var mv=$("#mv"),mu=$("#mu");
var active=-1,locked=-1;
rows.forEach(function(r,i){
  r.addEventListener("mouseenter",function(){if(locked<0)setActive(i);});
  r.addEventListener("focus",function(){if(locked<0)setActive(i);});
  r.addEventListener("click",function(){locked=(locked===i?-1:i);setActive(locked<0?i:locked);});
});
$("#stack").addEventListener("mouseleave",function(){if(locked<0)setActive(-1);});
function setActive(i){
  active=i;
  rows.forEach(function(r,j){r.classList.toggle("on",j===i);});
  stack.classList.toggle("dim",i>=0);
  if(i>=0){mv.textContent=LAYERS[i].mt;mu.textContent=LAYERS[i].nm+" · 已抽出";}
  else{mv.textContent="—";mu.textContent="指向任一层";}
}

/* ---------- 场景 ---------- */
var canvas=$("#gl");
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.30;

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(24,1,0.1,60);
camera.position.set(0.95,1.05,7.4);
camera.lookAt(0,0,0);

function envTexture(){
  var c=document.createElement("canvas");c.width=256;c.height=256;var g=c.getContext("2d");
  var lin=g.createLinearGradient(0,0,0,256);
  lin.addColorStop(0,"#625A4E");lin.addColorStop(.40,"#3B342C");
  lin.addColorStop(.55,"#241F1B");lin.addColorStop(1,"#0D0C0A");
  g.fillStyle=lin;g.fillRect(0,0,256,256);
  var band=g.createLinearGradient(0,152,0,256);
  band.addColorStop(0,"rgba(224,208,182,0)");band.addColorStop(.55,"rgba(224,208,182,.34)");
  band.addColorStop(1,"rgba(224,208,182,.08)");
  g.fillStyle=band;g.fillRect(0,152,256,104);
  var k=g.createRadialGradient(58,40,2,58,40,124);
  k.addColorStop(0,"rgba(255,243,224,1)");k.addColorStop(1,"rgba(255,243,224,0)");
  g.fillStyle=k;g.fillRect(0,0,256,256);
  var rm=g.createRadialGradient(210,64,2,210,64,148);
  rm.addColorStop(0,"rgba(198,214,232,.9)");rm.addColorStop(1,"rgba(198,214,232,0)");
  g.fillStyle=rm;g.fillRect(0,0,256,256);
  var t=new THREE.CanvasTexture(c);
  t.mapping=THREE.EquirectangularReflectionMapping;
  if("colorSpace" in t)t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
var env=envTexture();
scene.environment=env;
var metal=function(){return new THREE.MeshStandardMaterial({color:0xB7B0A4,metalness:.95,roughness:.18,envMap:env,envMapIntensity:2.05});};
var dark =function(){return new THREE.MeshStandardMaterial({color:0x2E2A25,metalness:.62,roughness:.60,envMap:env,envMapIntensity:1.15});};

var key=new THREE.DirectionalLight(0xFFF1DE,2.55);key.position.set(-1.55,2.65,3.05);scene.add(key);
var rim=new THREE.DirectionalLight(0xC6D6E8,1.35);rim.position.set(2.95,1.15,-2.35);scene.add(rim);

function contactShadow(){
  var c=document.createElement("canvas");c.width=c.height=256;var g=c.getContext("2d");
  var rg=g.createRadialGradient(128,128,4,128,128,126);
  rg.addColorStop(0,"rgba(0,0,0,.92)");rg.addColorStop(.45,"rgba(0,0,0,.55)");rg.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=rg;g.fillRect(0,0,256,256);
  var t=new THREE.CanvasTexture(c);if("colorSpace" in t)t.colorSpace=THREE.SRGBColorSpace;
  var m=new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,opacity:.95});
  var p=new THREE.Mesh(new THREE.PlaneGeometry(5.4,5.4),m);
  p.rotation.x=-Math.PI/2;p.position.y=-1.335;scene.add(p);
}
contactShadow();

var root=new THREE.Group();root.scale.setScalar(.90);scene.add(root);
var plinthMat=new THREE.MeshStandardMaterial({color:0x23201C,metalness:.55,roughness:.72,envMap:env,envMapIntensity:.85});
var plinth=new THREE.Mesh(new THREE.CylinderGeometry(1.26,1.33,.045,160,1),plinthMat);plinth.position.y=-1.30;root.add(plinth);
var plinthTop=new THREE.Mesh(new THREE.CylinderGeometry(1.19,1.19,.016,160,1),plinthMat);plinthTop.position.y=-1.268;root.add(plinthTop);
var spindle=new THREE.Mesh(new THREE.CylinderGeometry(.115,.115,1.20,40,1),metal());spindle.position.y=-0.66;root.add(spindle);
var collar=new THREE.Mesh(new THREE.CylinderGeometry(.145,.145,.055,48,1),
  new THREE.MeshStandardMaterial({color:0xC97B45,emissive:0xC97B45,emissiveIntensity:.5,metalness:.4,roughness:.42,envMap:env,envMapIntensity:1.2}));
collar.position.y=-0.10;root.add(collar);
var collarLow=new THREE.Mesh(new THREE.CylinderGeometry(.135,.135,.05,48,1),
  new THREE.MeshStandardMaterial({color:0xC97B45,emissive:0xC97B45,emissiveIntensity:.32,metalness:.4,roughness:.45,envMap:env,envMapIntensity:1.1}));
collarLow.position.y=-0.86;root.add(collarLow);

var dummy=new THREE.Object3D();
function instMesh(geo,mat,count,place){
  var m=new THREE.InstancedMesh(geo,mat,count);
  for(var i=0;i<count;i++){
    dummy.position.set(0,0,0);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);
    place(i,dummy,count);
    dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);
  }
  m.instanceMatrix.needsUpdate=true;return m;
}

var built=[];
LAYERS.forEach(function(L,i){
  var g=new THREE.Group();g.position.set(0,BASE_Y[i],0);root.add(g);
  var mS=metal(),mD=dark();
  var r=L.r;
  var rimM=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.105,160,1),mD);g.add(rimM);
  var face=new THREE.Mesh(new THREE.CylinderGeometry(r-.055,r-.055,.03,160,1),mS);face.position.y=.056;g.add(face);
  var hub=new THREE.Mesh(new THREE.CylinderGeometry(.30,.30,.145,64,1),mS);g.add(hub);

  if(L.kind==="notch"){
    g.add(instMesh(new THREE.BoxGeometry(.05,.085,.11),mD,24,function(i,d){
      var a=i/24*Math.PI*2;d.position.set(Math.cos(a)*(r-.03),0,Math.sin(a)*(r-.03));d.rotation.y=-a;
    }));
  }else if(L.kind==="port"){
    g.add(instMesh(new THREE.CylinderGeometry(.032,.032,.10,16,1),mD,52,function(i,d){
      var a=i/52*Math.PI*2;d.position.set(Math.cos(a)*.74,.062,Math.sin(a)*.74);
    }));
  }else if(L.kind==="etch"){
    g.add(instMesh(new THREE.BoxGeometry(.0065,.008,.30),mD,72,function(i,d){
      var a=i/72*Math.PI*2;d.position.set(Math.cos(a)*.60,.074,Math.sin(a)*.60);d.rotation.y=-a;
    }));
  }else if(L.kind==="groove"){
    for(var k=0;k<12;k++){
      var rr=.40+(k/11)*(r-.52);
      var t=new THREE.Mesh(new THREE.TorusGeometry(rr,.0065,8,180),mS);
      t.rotation.x=Math.PI/2;t.position.y=.073;g.add(t);
    }
  }else if(L.kind==="slot"){
    g.add(instMesh(new THREE.BoxGeometry(.10,.075,.17),mD,5,function(i,d){
      var a=i/5*Math.PI*2;d.position.set(Math.cos(a)*(r-.07),.02,Math.sin(a)*(r-.07));d.rotation.y=-a;
    }));
  }

  var ringMat=new THREE.MeshStandardMaterial({color:0xC97B45,emissive:0xC97B45,emissiveIntensity:.7,
    metalness:.3,roughness:.4,transparent:true,opacity:0});
  var ring=new THREE.Mesh(new THREE.TorusGeometry(r+.005,.013,10,200),ringMat);
  ring.rotation.x=Math.PI/2;ring.position.y=.058;g.add(ring);

  built.push({g:g,base:BASE_Y[i],steel:mS,dark:mD,ring:ring,ringMat:ringMat,r:r,
    cs:mS.color.clone(),cd:mD.color.clone(),k:1,
    x:0,y:BASE_Y[i],tX:0,tY:BASE_Y[i],tK:1,tR:0});
});

/* ---------- 布局：把物体推到右三分之一 ---------- */
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  var shift=(w>=1100)?0.17:(w>=760?0.09:0);
  if(shift)camera.setViewOffset(w,h,-w*shift,0,w,h);else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  var svg=$("#leads");svg.setAttribute("viewBox","0 0 "+w+" "+h);
}
window.addEventListener("resize",resize);resize();

/* ---------- 指针视差（无常驻自转） ---------- */
var px=0,py=0,tpx=0,tpy=0;
window.addEventListener("pointermove",function(e){
  px=(e.clientX/window.innerWidth-.5)*2;py=(e.clientY/window.innerHeight-.5)*2;
});
function damp(a,b,l,dt){return b+(a-b)*Math.exp(-l*dt);}

/* ---------- 引线 ---------- */
var svg=$("#leads");
var line=document.createElementNS("http://www.w3.org/2000/svg","path");
line.setAttribute("fill","none");line.setAttribute("stroke","rgba(201,123,69,.9)");
line.setAttribute("stroke-width","1");line.setAttribute("stroke-dasharray","3 3");
svg.appendChild(line);
var dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
dot.setAttribute("r","2.5");dot.setAttribute("fill","#C97B45");svg.appendChild(dot);
var tag=document.createElementNS("http://www.w3.org/2000/svg","text");
tag.setAttribute("font-size","11");tag.setAttribute("fill","#D8CFC1");
tag.setAttribute("font-family","inherit");tag.setAttribute("text-anchor","end");
svg.appendChild(tag);
var v=new THREE.Vector3();

function f1(v){var x=Math.round(v*10)/10;return isFinite(x)?x:0;}
function updateLeads(){
  if(active<0){line.setAttribute("d","");dot.setAttribute("opacity","0");tag.textContent="";return;}
  built[active].g.updateMatrixWorld();
  v.set(-built[active].r-.02,.058,0).applyMatrix4(built[active].g.matrixWorld).project(camera);
  var ax=(v.x*.5+.5)*window.innerWidth, ay=(-v.y*.5+.5)*window.innerHeight;
  var rr=rows[active].getBoundingClientRect();
  var sx=rr.right+10, sy=rr.top+rr.height/2;
  var mid=Math.max(sx+26,ax-34);
  line.setAttribute("d","M"+f1(sx)+","+f1(sy)+" L"+f1(mid)+","+f1(sy)+" L"+f1(ax)+","+f1(ay));
  dot.setAttribute("cx",f1(ax));dot.setAttribute("cy",f1(ay));dot.setAttribute("opacity","1");
  tag.setAttribute("x",f1(ax-8));tag.setAttribute("y",f1(ay-9));
  tag.textContent=LAYERS[active].nm+" · "+LAYERS[active].mt;
}

/* ---------- 循环 ---------- */
var last=performance.now();
function tick(now){
  var dt=Math.min((now-last)/1000,.05);last=now;
  tpx=reduce?0:damp(tpx,px,3.2,dt);
  tpy=reduce?0:damp(tpy,py,3.2,dt);
  root.rotation.y=-0.62+tpx*0.10;
  root.rotation.x=tpy*0.035;

  built.forEach(function(b,j){
    var on=(active===j);
    b.tX=on?0.70:0;
    if(active<0){b.tY=b.base;}
    else{
      var dir=(j<active)?1:(j>active?-1:0);
      b.tY=b.base+dir*0.11+(on?0.08:0);
    }
    b.tK=(active<0)?1:(on?1:0.34);
    b.tR=on?1:0;
    b.x=damp(b.x,b.tX,7,dt);b.y=damp(b.y,b.tY,7,dt);
    b.k=damp(b.k,b.tK,6,dt);
    b.steel.color.copy(b.cs).multiplyScalar(b.k);
    b.dark.color.copy(b.cd).multiplyScalar(b.k);
    b.steel.envMapIntensity=0.55+1.5*b.k;
    b.dark.envMapIntensity=0.5+0.7*b.k;
    b.g.position.set(b.x,b.y,0);
    b.ringMat.opacity=damp(b.ringMat.opacity,b.tR,6,dt);
    b.ring.visible=b.ringMat.opacity>0.01;
  });

  renderer.render(scene,camera);
  updateLeads();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
