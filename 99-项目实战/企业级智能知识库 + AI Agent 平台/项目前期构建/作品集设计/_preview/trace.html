<!doctype html><meta charset="utf-8"><body><canvas id="c"></canvas>
<script>
const img = new Image();
img.onload = () => {
  const W = 210, H = Math.round(210 * 1824 / 842);  // 210×455
  const c = document.getElementById('c');
  c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data;

  function hsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), dd = mx - mn;
    let h = 0;
    if (dd > 1e-6) {
      if (mx === r) h = 60 * (((g - b) / dd) % 6);
      else if (mx === g) h = 60 * ((b - r) / dd + 2);
      else h = 60 * ((r - g) / dd + 4);
    }
    if (h < 0) h += 360;
    return { h, s: mx ? dd / mx : 0, v: mx };
  }

  // 只分两类：水 / 非水。水 = 有饱和度的青蓝
  const isWater = [];
  for (let y = 0; y < H; y++) {
    const row = new Uint8Array(W);
    for (let xx = 0; xx < W; xx++) {
      const i = (y * W + xx) * 4;
      const { h, s, v } = hsv(d[i], d[i + 1], d[i + 2]);
      row[xx] = (s > 0.26 && h >= 152 && h <= 208 && v > 0.20) ? 1 : 0;
    }
    isWater.push(row);
  }
  // 从左边找第一段连续水体的右边界
  const edge = [];
  for (let y = 0; y < H; y++) {
    const row = isWater[y];
    let run = 0, end = -1;
    for (let xx = 0; xx < W; xx++) {
      if (row[xx]) { run++; end = xx; }
      else if (run > 3) break;           // 水体断开
      else if (xx > 12) { run = 0; end = -1; break; }
    }
    edge.push(run > 6 ? end : 0);
  }
  // 中值 + 滑动平均平滑
  const med = edge.map((v, i) => {
    const s = edge.slice(Math.max(0, i - 2), i + 3).sort((a, b) => a - b);
    return s[Math.floor(s.length / 2)];
  });
  const sm = med.map((v, i) => {
    let a = 0, n = 0;
    for (let k = -4; k <= 4; k++) { const j = i + k; if (j >= 0 && j < H) { a += med[j]; n++; } }
    return a / n;
  });
  // 取样 34 点，折算到 842×1824
  const pts = [];
  for (let k = 0; k <= 34; k++) {
    const i = Math.round(k / 34 * (H - 1));
    pts.push([+(sm[i] / W * 842).toFixed(1), +(i / (H - 1) * 1824).toFixed(1)]);
  }
  // 覆盖率
  let water = 0, tot = 0;
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) { tot++; if (isWater[y][xx]) water++; }
  window.__P = { pts, waterShare: +(water / tot).toFixed(3), grid: [W, H] };
  document.title = 'ok';
};
img.src = '../assets/beach-base.jpg';
</script>
