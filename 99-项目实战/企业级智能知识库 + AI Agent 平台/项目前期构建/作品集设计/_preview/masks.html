<!doctype html><meta charset="utf-8"><body><canvas id="src"></canvas><canvas id="out"></canvas>
<script>
const img = new Image();
img.onload = () => {
  const W = 210, H = Math.round(210 * 1824 / 842);   // 210×455
  const src = document.getElementById('src');
  src.width = W; src.height = H;
  const sx = src.getContext('2d', { willReadFrequently: true });
  sx.drawImage(img, 0, 0, W, H);
  const d = sx.getImageData(0, 0, W, H).data;

  function hsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), dd = mx - mn;
    let h = 0;
    if (dd > 1e-6) {
      if (mx === r) h = 60 * (((g - b) / dd) % 6);
      else if (mx === g) h = 60 * ((b - r) / dd + 2);
      else h = 60 * ((r - g) / dd + 4);
    }
    if (h < 0) h += 360;
    return { h, s: mx ? dd / mx : 0, v: mx };
  }

  // 硬 waters 图
  const water = new Uint8Array(W * H);
  for (let i = 0, p = 0; p < W * H; p++, i += 4) {
    const { h, s, v } = hsv(d[i], d[i + 1], d[i + 2]);
    water[p] = (s > 0.24 && h >= 150 && h <= 208 && v > 0.18) ? 1 : 0;
  }
  // 形态学清理：3 次开运算，去掉孤立噪点
  const clean = new Uint8Array(water);
  for (let pass = 0; pass < 3; pass++) {
    const t = new Uint8Array(clean);
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const p = y * W + x;
      if (!t[p]) {
        // 膨胀：邻域里水多则变水
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) n += t[(y + dy) * W + x + dx];
        if (n >= 6) clean[p] = 1;
      } else {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) n += t[(y + dy) * W + x + dx];
        if (n <= 4) clean[p] = 0;
      }
    }
  }

  const c1 = document.createElement('canvas'); c1.width = W; c1.height = H;
  const a = c1.getContext('2d');
  const img1 = a.createImageData(W, H);
  for (let p = 0; p < W * H; p++) {
    const v = clean[p] ? 255 : 0;
    img1.data[p * 4] = v; img1.data[p * 4 + 1] = v; img1.data[p * 4 + 2] = v; img1.data[p * 4 + 3] = 255;
  }
  a.putImageData(img1, 0, 0);

  // 水域软遮罩
  const sea = document.createElement('canvas'); sea.width = W; sea.height = H;
  const sc = sea.getContext('2d');
  sc.filter = 'blur(9px)';
  sc.drawImage(c1, 0, 0);

  // 岸线带：水域图减去腐蚀后的水域图
  const er = document.createElement('canvas'); er.width = W; er.height = H;
  const ec = er.getContext('2d');
  ec.drawImage(c1, 0, 0);
  ec.globalCompositeOperation = 'destination-in';
  const inner = document.createElement('canvas'); inner.width = W; inner.height = H;
  const ic = inner.getContext('2d');
  ic.filter = 'blur(5px)'; ic.drawImage(c1, 0, 0);
  // 用 "原图 - 模糊原图" 得不到环，改用：先整体填充，再用 blur 后图做 destination-out 的阈值近似
  // 简化：环形 = 水域图 ∩ 非(腐蚀水域图)
  const band = document.createElement('canvas'); band.width = W; band.height = H;
  const bc = band.getContext('2d');
  bc.drawImage(c1, 0, 0);
  bc.globalCompositeOperation = 'destination-out';
  // 腐蚀：把水域图缩小 5px 后作为挖除
  const shrink = document.createElement('canvas'); shrink.width = W; shrink.height = H;
  const sh = shrink.getContext('2d');
  sh.filter = 'blur(6px) contrast(3)';
  sh.drawImage(c1, 0, 0);
  bc.drawImage(shrink, 0, 0);
  bc.globalCompositeOperation = 'source-over';
  // 再加宽：blur 得到柔和带
  const band2 = document.createElement('canvas'); band2.width = W; band2.height = H;
  const b2 = band2.getContext('2d');
  b2.filter = 'blur(7px)';
  b2.drawImage(band, 0, 0);
  b2.filter = 'none';
  b2.globalCompositeOperation = 'source-in';
  b2.fillStyle = '#fff';
  b2.fillRect(0, 0, W, H);

  window.__M = { sea: sea.toDataURL('image/png'), foam: band2.toDataURL('image/png') };
  document.title = 'ok';
};
img.src = '../assets/beach-base.jpg';
</script>
