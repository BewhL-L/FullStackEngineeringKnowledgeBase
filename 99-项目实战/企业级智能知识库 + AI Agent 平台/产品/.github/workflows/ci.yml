name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-test:
    name: Backend Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 产品/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          LLM_API_KEY: test-key
        run: pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 产品/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
