# 生产增强版：在基础版之上增加 Redis 缓存 + Celery 异步文档处理
# 用法：
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
version: '3.8'

services:
  # Redis：缓存 + Celery broker/result
  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Celery worker：异步执行文档解析 / 切片 / 向量化
  celery-worker:
    build: ./backend
    container_name: kb-celery
    restart: unless-stopped
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/.env:/app/.env
    environment:
      - DATABASE_URL=sqlite:///./knowledge_base.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - redis

  # 让后端也连上 Redis（启用缓存与 broker 配置）
  backend:
    depends_on:
      - redis
    environment:
      - DATABASE_URL=sqlite:///./knowledge_base.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2

volumes:
  redis_data:
