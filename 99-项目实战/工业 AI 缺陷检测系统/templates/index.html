<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业缺陷检测系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }
        .main-panel {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card h3 {
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .upload-area input[type="file"] {
            width: 100%;
            margin: 10px 0;
        }
        .upload-area button {
            width: 100%;
            padding: 10px;
            background: #1890ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .upload-area button:hover { background: #40a9ff; }
        .upload-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .stats-item {
            margin: 10px 0;
            font-size: 14px;
            color: #666;
        }
        .level-tag {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border-radius: 2px;
            vertical-align: middle;
        }
        .level-轻微 { background: #ffff00; }
        .level-一般 { background: #ffa500; }
        .level-严重 { background: #ff0000; }

        .result-badge {
            margin-top: 15px;
            padding: 12px;
            text-align: center;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
        }
        .pass { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .fail { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }

        .canvas-wrap {
            width: 100%;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 450px;
            color: #999;
        }
        #defectCanvas { max-width: 100%; max-height: 600px; }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            padding: 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            cursor: pointer;
        }
        .history-item:hover { background: #f5f5f5; }
        .history-item .time {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }
        .global-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: center;
        }
        .global-stats .num {
            font-size: 20px;
            font-weight: bold;
            color: #1890ff;
        }
        .global-stats .label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧主面板 -->
        <div class="main-panel">
            <h3 style="margin-bottom: 15px;">检测结果</h3>
            <div class="canvas-wrap" id="canvasWrap">
                <span>请上传工业图片开始检测</span>
                <canvas id="defectCanvas" style="display: none;"></canvas>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="side-panel">
            <!-- 上传检测 -->
            <div class="card upload-area">
                <h3>图片检测</h3>
                <input type="file" id="imageInput" accept="image/*">
                <button id="detectBtn" onclick="handleDetect()">开始检测</button>
            </div>

            <!-- 当前检测统计 -->
            <div class="card">
                <h3>本次检测</h3>
                <div class="stats-item">
                    <span class="level-tag level-轻微"></span>
                    轻微缺陷：<span id="countMinor">0</span> 个
                </div>
                <div class="stats-item">
                    <span class="level-tag level-一般"></span>
                    一般缺陷：<span id="countNormal">0</span> 个
                </div>
                <div class="stats-item">
                    <span class="level-tag level-严重"></span>
                    严重缺陷：<span id="countMajor">0</span> 个
                </div>
                <div class="stats-item" style="font-weight: bold; color: #333;">
                    总缺陷数：<span id="totalCount">0</span> 个
                </div>
                <div id="resultBadge" class="result-badge pass">产品合格</div>
            </div>

            <!-- 全局统计 -->
            <div class="card">
                <h3>全局统计</h3>
                <div class="global-stats">
                    <div>
                        <div class="num" id="totalRecords">0</div>
                        <div class="label">总检测数</div>
                    </div>
                    <div>
                        <div class="num" id="passRate">0%</div>
                        <div class="label">合格率</div>
                    </div>
                </div>
            </div>

            <!-- 历史记录 -->
            <div class="card">
                <h3>历史记录</h3>
                <div class="history-list" id="historyList">
                    <div style="color:#999; text-align:center; padding:20px;">暂无记录</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const levelColors = {
            "轻微": "#ffff00",
            "一般": "#ffa500",
            "严重": "#ff0000"
        };

        // 页面加载时获取全局统计和历史记录
        window.onload = function() {
            loadGlobalStats();
            loadHistory();
        };

        // 执行检测
        async function handleDetect() {
            const fileInput = document.getElementById('imageInput');
            const btn = document.getElementById('detectBtn');
            
            if (!fileInput.files.length) {
                alert('请先选择图片');
                return;
            }

            btn.disabled = true;
            btn.textContent = '检测中...';

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const res = await fetch('/api/detect', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.code !== 0) {
                    alert(data.error || '检测失败');
                    return;
                }

                renderResult(data);
                loadGlobalStats();
                loadHistory();

            } catch (e) {
                alert('请求失败: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '开始检测';
            }
        }

        // 渲染检测结果
        function renderResult(data) {
            const canvas = document.getElementById('defectCanvas');
            const ctx = canvas.getContext('2d');
            const wrap = document.getElementById('canvasWrap');
            const img = new Image();

            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.style.display = 'block';
                wrap.querySelector('span').style.display = 'none';

                ctx.drawImage(img, 0, 0);

                // 绘制缺陷框与标注
                data.defects.forEach(defect => {
                    const bbox = defect.bbox;
                    const color = levelColors[defect.level];

                    // 半透明填充
                    ctx.fillStyle = color + '40';
                    ctx.fillRect(bbox.x_min, bbox.y_min, bbox.width, bbox.height);

                    // 边框
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bbox.x_min, bbox.y_min, bbox.width, bbox.height);

                    // 文字标注
                    ctx.fillStyle = color;
                    ctx.font = 'bold 14px Arial';
                    ctx.fillText(
                        `#${defect.defect_id} ${defect.area}px`,
                        bbox.x_min,
                        Math.max(bbox.y_min - 4, 14)
                    );
                });
            };

            img.src = data.visualization;

            // 更新统计面板
            document.getElementById('countMinor').textContent = data.statistics.level_count['轻微'];
            document.getElementById('countNormal').textContent = data.statistics.level_count['一般'];
            document.getElementById('countMajor').textContent = data.statistics.level_count['严重'];
            document.getElementById('totalCount').textContent = data.statistics.total_defects;

            const badge = document.getElementById('resultBadge');
            if (data.statistics.is_qualified) {
                badge.textContent = '产品合格';
                badge.className = 'result-badge pass';
            } else {
                badge.textContent = '产品不合格';
                badge.className = 'result-badge fail';
            }
        }

        // 加载全局统计
        async function loadGlobalStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.code === 0) {
                    document.getElementById('totalRecords').textContent = data.data.total_records;
                    document.getElementById('passRate').textContent = data.data.pass_rate + '%';
                }
            } catch (e) {
                console.error('加载统计失败', e);
            }
        }

        // 加载历史记录
        async function loadHistory() {
            try {
                const res = await fetch('/api/records?limit=10');
                const data = await res.json();
                const listEl = document.getElementById('historyList');
                
                if (data.data.length === 0) {
                    listEl.innerHTML = '<div style="color:#999; text-align:center; padding:20px;">暂无记录</div>';
                    return;
                }

                let html = '';
                data.data.forEach(item => {
                    const time = new Date(item.create_time * 1000).toLocaleString();
                    const status = item.is_qualified ? '合格' : '不合格';
                    const color = item.is_qualified ? '#52c41a' : '#ff4d4f';
                    html += `
                        <div class="history-item">
                            <div>
                                #${item.id} 缺陷数：${item.total_defects}个
                                <span style="color:${color}; float:right;">${status}</span>
                            </div>
                            <div class="time">${time}</div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

            } catch (e) {
                console.error('加载历史失败', e);
            }
        }
    </script>
</body>
</html>
